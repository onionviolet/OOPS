<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Round 14 drafts</title>
<!-- PS170 drafts, batch 1 (proposals, AD32): capabilities with no surface or a stray one (docs/audits/UI_SURFACE_COVERAGE_2026-11-15.md, SFC codes),
     drawn in round 14's four columns at 1920x1080 with the round 14 mock's own styles and helpers (prototypes/yair-columns-2026-11-15) and the
     kit's forms (prototypes/ui-kit-2026-11-15). A gold dashed outline marks the drafted box; the dashed note under Reports says the box and tab,
     verb, Ready mark, known / estimated / "?" numbers and the empty state. Nothing is built until Weibao looks.
     ?d=d1..d5 picks a draft (keys 1-5); &cmp shows it beside today's screen of the same life (DEV fixture capture). -->
<style>
:root { --bg:#0a0d24; --box:#141b45; --head:#1d2a66; --line:#5b63b0; --quiet:#2d3570; --text:#e8ecff; --muted:#a3abd6; --gold:#ffd24a;
  --green:#3fd27a; --teal:#1f5f5a; --rep:#2a1d4d; --hp:#ff6b6b; --xp:#b5a36a; --st:#4ee07a; --mana:#7f8ed8; --danger:#ff9d57; }
* { box-sizing:border-box; }
html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:var(--bg); color:var(--text); font:15px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
#ref { position:absolute; inset:0; width:1920px; height:1080px; object-fit:contain; background:#000; display:none; }
body:not([data-opt="mock"]) #ref { display:block; } body:not([data-opt="mock"]) #frame { display:none; }
/* Four fixed columns (PS119). YAIR sizes them for 1366; at 1920 the extra width goes to columns 2 and 3 (PS128). */
.col { position:absolute; top:10px; bottom:46px; display:flex; flex-direction:column; gap:10px; min-height:0; }
.c1 { left:14px; width:372px; } .c2 { left:398px; width:640px; } .c3 { left:1050px; width:470px; } .c4 { left:1532px; width:374px; }
.box { background:var(--box); border:1px solid var(--line); border-radius:6px; display:flex; flex-direction:column; min-height:0; flex:0 1 auto; overflow:hidden; }
.box.grow { flex:1 1 auto; } .box.teal { background:#0f2b33; border-color:#2b8a80; } .box.rep { background:var(--rep); border-color:#7a5ab0; }
.box > h3 { margin:0; padding:7px 10px; font-size:15px; background:rgba(255,255,255,.04); border-bottom:1px solid var(--quiet); display:flex; justify-content:space-between; gap:8px; }
.box > h3 small { color:var(--gold); font-weight:600; }
.box > .body { padding:6px 10px; overflow:auto; min-height:0; flex:1 1 auto; }
.bar { position:relative; height:19px; margin:3px 0; border-radius:2px; text-align:center; font-size:12px; line-height:19px; color:#111; }
.bar i { position:absolute; inset:0; width:var(--f); background:var(--c); border-radius:2px; } .bar span { position:relative; }
.bar.empty { background:#2a2f55; }
.grid { display:grid; grid-template-columns:1fr auto 1fr auto; border:1px solid var(--quiet); font-size:14px; }
.grid span { padding:2px 6px; border-bottom:1px solid var(--quiet); } .grid span:nth-child(even) { text-align:right; border-right:1px solid var(--quiet); }
.tabs { display:flex; gap:4px; flex-wrap:wrap; margin:6px 0 2px; } .tab { flex:1; text-align:center; border:1px solid var(--line); border-radius:4px; padding:3px 6px; background:#24306e; font-size:14px; white-space:nowrap; }
.tab.on { background:var(--gold); color:#151515; font-weight:700; } .tab.sm { flex:0 0 auto; font-size:13px; }
.row { display:flex; justify-content:space-between; gap:8px; padding:3px 0; border-bottom:1px solid var(--quiet); font-size:14px; }
.m { color:var(--muted); } .g { color:var(--gold); } .warn { color:var(--danger); } .ok { color:var(--green); }
/* Column 2: the time strip with the day strip, the location box and the actions box. */
.time { display:flex; justify-content:space-between; font-size:18px; padding:8px 12px; } .time b { font-weight:700; }
.daystrip { position:relative; height:12px; margin:0 12px 8px; border:1px solid var(--quiet); background:#1a2456; }
.daystrip i { position:absolute; inset:0; width:var(--now); background:#3a56b8; } .daystrip b { position:absolute; top:-2px; bottom:-2px; left:var(--now); width:3px; background:var(--gold); }
.loc { padding:8px 12px; } .loc .name { font-size:20px; } .loc .desc { font-style:italic; color:var(--muted); margin:4px 0 6px; }
.loc .here a { color:var(--text); text-decoration:underline; text-underline-offset:3px; }
.status2 { padding:6px 12px; font-size:14px; border-top:1px solid var(--quiet); }
.verb { display:flex; align-items:center; gap:10px; border:1px solid #6d6a8a; border-radius:3px; padding:7px 10px; margin:6px 0; font-size:17px; background:rgba(255,255,255,.02); }
.verb .ic { width:22px; text-align:center; color:var(--text); font-size:17px; } .verb .mark { margin-left:auto; font-size:13px; color:var(--gold); }
.verb .mark.near { color:var(--muted); } .verb.open { border-color:var(--gold); }
.sub { margin:-2px 0 6px 34px; } .sub .row { font-size:14px; } .sub .act { border:1px solid var(--line); border-radius:3px; padding:1px 8px; }
.sub .act.near { border-style:dashed; color:var(--muted); }
.head-run { border:1px solid var(--gold); border-radius:3px; padding:6px 10px; margin:4px 0 8px; } .head-run .bar { height:8px; }
/* Column 4: Reports with YAIR's footer filters plus Ready and Story (PS124). */
.log .row { justify-content:center; text-align:center; font-size:13.5px; } .log .row.place { color:var(--gold); font-weight:700; }
.rightnow { border-bottom:1px solid var(--quiet); padding:4px 0 8px; font-size:14px; }
.filters { display:flex; flex-wrap:wrap; gap:3px; padding:6px 8px; border-top:1px solid var(--quiet); }
.filters span { border:1px solid var(--gold); color:var(--gold); padding:2px 6px; font-size:13.5px; border-radius:3px; } .filters span.new { border-style:dashed; }
/* Footer (PS123): no top bar. */
.foot { position:absolute; left:0; right:0; bottom:0; height:38px; display:flex; align-items:center; gap:2px; background:#070a1c; border-top:1px solid var(--gold); padding:0 8px; font-size:16px; }
.foot span { padding:6px 10px; } .foot .mid { margin-left:auto; } .foot .mid span, .foot .menu { border:1px solid var(--line); border-radius:4px; margin:0 3px; padding:3px 10px; }
.foot .r { margin-left:auto; color:var(--muted); font-size:13px; }
.menu-pop { position:absolute; bottom:40px; background:#070a1c; border:1px solid var(--gold); padding:4px 0; font-size:14px; display:none; z-index:5; }
.menu-pop div { padding:2px 14px; } .menu-pop .h { color:var(--muted); font-size:12px; }
body.menus .menu-pop { display:block; }
/* Fight card replaces column 2's middle (PS121). */
.fight .opp { border:1px solid var(--line); border-radius:3px; padding:4px 8px; margin-bottom:6px; }
.fight .stats { display:flex; gap:14px; font-size:13px; color:var(--muted); } .fight .hpbar { height:20px; background:#3a1010; border-radius:2px; position:relative; text-align:center; font-size:13px; line-height:20px; }
.fight .hpbar i { position:absolute; left:0; top:0; bottom:0; width:var(--f); background:#e23b3b; border-radius:2px; } .fight .hpbar span { position:relative; }
.approach { display:flex; gap:6px; font-size:13px; margin-bottom:6px; } .approach span { border:1px solid var(--line); border-radius:3px; padding:2px 8px; } .approach span.on { border-color:var(--gold); color:var(--gold); }
.empty-slot { border-top:1px solid var(--quiet); height:46px; }
/* Mapping screen (PS125). */
.map { position:absolute; inset:10px 14px 46px; overflow:hidden; display:grid; grid-template-columns:1fr 1fr; gap:14px; font-size:13.5px; }
.map table { border-collapse:collapse; width:100%; } .map th, .map td { border:1px solid var(--quiet); padding:3px 7px; text-align:left; vertical-align:top; } .map th { background:var(--head); }
.map h2 { font-size:16px; margin:4px 0; color:var(--gold); }
.note { position:fixed; left:398px; bottom:42px; font-size:11px; color:var(--muted); }
#pick { position:fixed; right:14px; bottom:44px; z-index:9; background:#000c; border:1px solid var(--gold); padding:5px 7px; font-size:12px; }
#pick button { font:inherit; color:var(--text); background:#1a2456; border:1px solid var(--line); margin:1px; padding:2px 6px; cursor:pointer; }
#pick button[aria-pressed="true"] { border-color:var(--gold); color:var(--gold); }
body.shot #pick, body.shot .note { display:none; }

/* Draft additions (PS170): a draft box is outlined gold-dashed; the spec card is a note, not UI. Kit forms from prototypes/ui-kit-2026-11-15. */
.draft { outline:2px dashed var(--gold); outline-offset:2px; position:relative; }
.draft::after { content:"DRAFT"; position:absolute; top:0; left:50%; transform:translateX(-50%); z-index:2; font-size:10px; letter-spacing:.08em; background:var(--gold); color:#151515; padding:0 5px; border-radius:2px; }
.verb + .sub, .draft .sub { margin-left:34px; }
.num.est { color:var(--gold); } .num.est::after { content:" est"; font-size:10px; color:var(--muted); vertical-align:super; }
.num.unk { color:var(--muted); border-bottom:1px dotted var(--muted); cursor:help; }
.k.ready { color:var(--green); } .k.near { color:var(--gold); } .k.far { color:var(--muted); } .k.blocked { color:var(--danger); }
.k.ready::before { content:"● "; } .k.near::before { content:"◐ "; } .k.far::before { content:"○ "; } .k.blocked::before { content:"⊘ "; }
.wtable, .gtable { display:grid; grid-template-columns:1.1fr .6fr .6fr .8fr; font-size:13.5px; border:1px solid var(--quiet); margin:4px 0; font-variant-numeric:tabular-nums; }
.gtable { grid-template-columns:1.5fr 1fr .8fr .8fr; }
.wtable span, .gtable span { padding:2px 6px; border-bottom:1px solid var(--quiet); } .wtable span:nth-child(4n+2), .wtable span:nth-child(4n+3), .wtable span:nth-child(4n) { text-align:right; }
.method { border:1px solid var(--line); border-radius:3px; padding:4px 8px; margin:6px 0; } .method.pick { border-color:var(--gold); }
.tide { display:flex; flex-direction:column; gap:2px; font-size:14px; border-left:3px solid var(--danger); padding:4px 8px; margin:2px 0 6px; background:rgba(255,157,87,.07); }
.spec { flex:0 0 auto; border:1px dashed #8b8fb8; background:#0b0f2a; border-radius:4px; padding:6px 9px; font-size:12.5px; }
.spec h4 { margin:0 0 4px; font-size:12px; color:var(--gold); letter-spacing:.03em; }
.spec div { display:grid; grid-template-columns:78px 1fr; gap:6px; padding:2px 0; border-bottom:1px solid #1d2350; } .spec b { color:var(--muted); font-weight:600; }
.spec p { margin:4px 0 0; color:var(--muted); font-size:11.5px; }
.c4 .box.rep { flex:1 1 40%; }
/* D6 fight panel (DU14, DU37), class names after the combat lane's src/ui/combat_versus.js; mount point left open. */
.fight2 { display:flex; flex-direction:column; gap:6px; padding:6px 10px; }
.stakes { align-self:flex-start; font-size:12.5px; border:1px solid var(--danger); color:var(--danger); border-radius:10px; padding:1px 9px; }
.approach2 { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:13px; border:1px solid var(--quiet); border-radius:3px; padding:5px 8px; }
.approach2 .act, .band .act { border:1px solid var(--line); border-radius:3px; padding:0 6px; }
.versus-bar.unk i { width:100%; background:repeating-linear-gradient(45deg,#3a4170 0 6px,#2a2f55 6px 12px); }
.approach2 .act.on { border-color:var(--gold); color:var(--gold); } .approach2 .act { margin-right:3px; font-size:12.5px; }
.versus { display:grid; grid-template-columns:1fr 1.25fr; gap:10px; } .versus h5 { margin:0 0 3px; font-size:12px; color:var(--muted); letter-spacing:.05em; text-transform:uppercase; }
.versus-card { position:relative; border:1px solid var(--line); border-radius:3px; padding:5px 8px 5px 8px; margin-bottom:6px; background:rgba(255,255,255,.02); transition:opacity .6s, filter .6s; }
.versus-card[data-down] { opacity:.38; filter:grayscale(1); } .versus-card .nm { display:flex; align-items:center; gap:6px; font-weight:700; font-size:14px; padding-right:2px; }
.versus-card .nm small { font-weight:400; color:var(--muted); margin-left:auto; font-size:12px; }
.sigil { width:24px; height:24px; flex:0 0 24px; border:1px solid var(--line); border-radius:3px; background:#0f1438; }
.versus-bar { position:relative; height:15px; background:#3a1010; border-radius:2px; margin:3px 0; font-size:11.5px; line-height:15px; text-align:center; overflow:hidden; }
.versus-bar i { position:absolute; left:0; top:0; bottom:0; width:var(--f); background:#e23b3b; } .versus-bar b { position:absolute; left:0; top:0; bottom:0; width:var(--l); background:#7a1d1d; }
.versus-bar span { position:relative; text-shadow:-1px 0 #000,1px 0 #000,0 -1px #000,0 1px #000; }
.versus-bar--you i { background:#e2763b; } .versus-bar--stamina { height:9px; background:#16301f; } .versus-bar--stamina i { background:var(--st); }
.versus-bar--timer { height:3px; background:#2a2050; margin:2px 0 3px; } .versus-bar--timer i { background:#9d7bff; }
.versus-means, .versus-wants { margin:1px 0; font-size:12.5px; color:var(--muted); } .versus-wants { color:var(--text); }
.inspect { position:absolute; right:6px; bottom:4px; font-size:11.5px; color:var(--muted); border:1px solid var(--quiet); border-radius:3px; padding:0 5px; }
.band { border:1px solid var(--gold); border-radius:3px; padding:6px 9px; background:rgba(255,210,74,.06); font-size:14px; }
.band .key { font:11px ui-monospace,monospace; border:1px solid var(--muted); border-radius:2px; padding:0 4px; margin-right:4px; color:var(--muted); }
.newtag { font-style:normal; font-size:10px; color:var(--gold); border:1px dashed var(--gold); border-radius:2px; padding:0 4px; margin-left:6px; text-transform:none; letter-spacing:0; }
.versus-allies { font-size:12.5px; margin:0 0 6px; }
.stages { display:flex; flex-direction:column; gap:0; margin:4px 0; } .stage { display:grid; grid-template-columns:22px 1fr auto; gap:8px; align-items:center; padding:5px 6px; border-left:2px solid var(--quiet); margin-left:10px; font-size:14px; }
.stage .dot { width:12px; height:12px; border-radius:50%; border:2px solid var(--line); margin-left:-14px; background:var(--box); } .stage.done .dot { background:var(--green); border-color:var(--green); } .stage.now { border-left-color:var(--gold); background:rgba(255,210,74,.06); } .stage.now .dot { border-color:var(--gold); }
.altar { display:grid; grid-template-columns:300px 1fr; gap:10px; align-items:start; } .altar svg text { fill:var(--text); font:12px system-ui; text-anchor:middle; }
.homegrid { display:grid; grid-template-columns:1fr 1fr; gap:6px; } .room { border:1px solid var(--line); border-radius:3px; padding:5px 8px; font-size:13.5px; } .room.here { border-color:var(--gold); } .room b { display:block; font-size:14px; }
.short { color:var(--hp); } .have { color:var(--green); } .tag { color:var(--muted); font-size:13px; } .arow { font-size:14px; } .arow .act { border:1px solid var(--line); border-radius:3px; padding:1px 8px; }
.held { display:flex; gap:8px; border-top:1px solid var(--quiet); padding-top:6px; margin-top:auto; } .held .verb { flex:1; margin:0; font-size:15px; } .c3 .head-run .bar { height:19px; }
#dtitle { position:fixed; left:398px; bottom:42px; font-size:11px; color:var(--muted); }
/* Compare view: the draft beside today's screen of the same life. */
#cmp { display:none; position:absolute; inset:0; background:#000; }
body.cmp #frame, body.cmp #dtitle { display:none; } body.cmp #cmp { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:34px 6px 6px; }
#cmp img { width:100%; object-fit:contain; align-self:start; border:1px solid #333; }
#cmp .lab { position:absolute; top:6px; font:15px system-ui; color:#fff; } #cmp .lab.l { left:10px; } #cmp .lab.r { left:calc(50% + 6px); }
</style>
</head>
<body data-opt="mock">
<div id="frame">
  <div class="col c1" id="c1"></div><div class="col c2" id="c2"></div><div class="col c3" id="c3"></div><div class="col c4" id="c4"></div>
  <div class="foot"><span>Save</span><span>Export</span><span>Import</span><span>⚙ Options</span><span class="menu">Menu ▴</span><span>Find</span>
    <div class="mid"><span>Layout ▴</span></div><span class="r">v0.6 · autosave on</span></div>
</div>
<div id="dtitle"></div>
<div id="cmp"><span class="lab l">Draft (round 14 grammar): <b id="cmpT"></b></span><span class="lab r">Today, same life (DEV fixture, headless 1920×1080)</span><img id="cmpL" alt="Draft"><img id="cmpR" alt="Today"></div>
<script>
const h = (t, c, x) => `<${t}${c ? ` class="${c}"` : ''}>${x}</${t}>`;
const box = (title, sub, body, cls = '') => `<section class="box ${cls}">${title ? `<h3><span>${title}</span><small>${sub || ''}</small></h3>` : ''}${h('div', 'body', body)}</section>`;
const bar = (t, c, f) => `<div class="bar${f ? '' : ' empty'}" style="--c:${c};--f:${f}%"><i></i><span>${t}</span></div>`;
const grid = pairs => h('div', 'grid', pairs.map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join(''));
const tabs = (list, on, cls = '') => h('div', 'tabs', list.map(t => `<span class="tab ${cls}${t === on ? ' on' : ''}">${t}</span>`).join(''));
const verb = (ic, name, mark = '', cls = '', sub = '') => h('div', `verb ${cls}`, `<span class="ic">${ic}</span><span>${name}</span>${mark ? `<span class="mark ${mark.startsWith('~') ? 'near' : ''}">${mark.replace(/^~/, '')}</span>` : ''}`) + (sub ? h('div', 'sub', sub) : '');
const subrow = (label, right, near) => h('div', 'row', `<span class="act${near ? ' near' : ''}">${label}</span><span class="m">${right}</span>`);
const STATS = grid([['Strength:', '12.0'], ['Agility:', '8.0'], ['Dexterity:', '10.0'], ['Intuition', '10.0'], ['Defense:', '1.0'], ['Magic:', '0.0'], ['Atk power:', '1.2'], ['Atk spd:', '1.0'], ['Crit rate:', '5.0%'], ['Crit mult:', '130.0%'], ['AP:', '32'], ['EP :', '25']]);
const C1 = ({name = 'Hero', lv = 0, hp = '60/60 hp', st = '40/40 stamina', effects = '0', effectLine = '', invTab = 'Inventory', inv, combat}) => [
  box('Character vitals', `Lv ${lv}`, h('div', 'tab', name) + bar('0 / 10 xp', 'var(--xp)', 0) + bar(st, 'var(--st)', 100) + bar('0/0 mana', 'var(--mana)', 0) + bar(hp, 'var(--hp)', parseInt(hp) / parseInt(hp.split('/')[1]) * 100), 'teal'),
  box('Character & preparation', '', h('div', 'row', '<b>Lvl: 0</b><span></span>') + STATS + h('div', 'row', `<span>Active effects:</span><span class="${effects === '0' ? '' : 'warn'}">${effects}</span>`) + effectLine + tabs(['Stats', 'Bio', 'Equipment', 'Tools'], 'Stats', 'sm'), 'teal'),
  box('Inventory & combat view', '', tabs(['Inventory', 'Combat'], invTab) + (invTab === 'Combat' ? combat : inv), 'teal grow'),
].join('');
const VILLAGE_INV = h('div', 'm', 'Your purse contains: 10C · 4W') + ['☆ Ledger workshop cache · 2W', '☆ Prepared survey kit ×2 · 2W', '☆ Sealed survey parcel ×2 · 3W', '☆ Stale bread ×5 [use] · 2C', '☆ [legs] Cheap leather pants [40%] [equip] · 4C 6W'].map(t => h('div', 'row', `<span>${t.split(' · ')[0]}</span><span>${t.split(' · ')[1]}</span>`)).join('') + tabs(['Sort by name', 'Sort by value', 'Sort by type'], 'Sort by name', 'sm');
const JOURNAL = (on, list) => box('Journal & received accounts', '', tabs(['Quests', 'Bestiary', 'Anthology', 'Data'], on) + tabs(['Knows', 'Notebook', 'People', 'Worlds', 'Beginning'], on, 'sm') + list + h('div', 'row', '<span></span><span class="m">Hide completed ☐</span>'));
const SKILLS = (on, extra, list) => box('Skills & practice', '', list + h('div', 'row', '<span></span><span class="m">Hide max level skills ☐</span>') + tabs(['Sort by name', 'Sort by level', 'Sort by progress'], 'Sort by name', 'sm') + tabs(['Skills', 'Stances', 'Magic', ...extra], on), 'grow');
const REPORTS = (rightNow, lines, extra = '') => `<section class="box rep grow"><h3><span>Reports</span><small>${extra}</small></h3><div class="body log">${h('div', 'rightnow', rightNow)}${lines.map(l => h('div', `row ${l.startsWith('[') ? 'place' : ''}`, l)).join('')}</div>` +
  h('div', 'filters', ['Levels / unlocks', 'Events', 'Crafting', 'Combat', 'Loot', 'BGM'].map(f => `<span>${f}</span>`).join('') + '<span class="new">Ready</span><span class="new">Story</span>') + '</section>';
const VILLAGE_TIME = (time, temp, now) => box('', '', h('div', 'time', `<span>${time}</span><span>${temp}</span>`) + `<div class="daystrip" style="--now:${now}"><i></i><b></b></div>`);
const VILLAGE_LOC = box('', '', h('div', 'loc', h('div', 'name', '☆ Village') + h('div', 'desc', 'Medium-sized village, built at the foot of the mountains, with rocks preventing any expansions towards north.') + h('div', 'here', 'Here: <a>2 people</a> · <a>6 stations</a> · <a>3 ways out</a>')) + h('div', 'status2', 'No work running.&nbsp;&nbsp; Saving available.'));

// ---- Draft additions (PS170). Kit forms: prototypes/ui-kit-2026-11-15 (PS171). ----
const est = t => `<span class="num est">${t}</span>`, unk = (t, why) => `<span class="num unk" title="${why}">${t}</span>`;
const row = (l, r = '', cls = '') => h('div', `row ${cls}`, `<span>${l}</span><span>${r}</span>`);
const draft = (title, sub, body, cls = '') => box(title, sub, body, `${cls} draft`);
const spec = s => `<section class="spec"><h4>${s.code} · draft note, not UI</h4>` + [
  ['Box · tab', s.box], ['Verb', s.verb], ['Ready mark', s.ready], ['Numbers', `known: ${s.known}<br>estimated: ${s.est}<br>"?": ${s.unk}`], ['Empty', s.empty], ['Replaces today', s.today]
