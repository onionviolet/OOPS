<div id="lotm-study">
  <header class="study-tools" aria-label="Comparison settings">
    <span class="study-label">LOTM / SAME SCENE LAB</span>
    <label>Fixture <select data-setting="scenario"><option value="ready">Morning errand</option><option value="short">Short of money</option><option value="closed">Bakery closed</option><option value="crowded">Crowded inventory</option></select></label>
    <label>Text <select data-setting="text"><option value="14">14 px</option><option value="17.5">17.5 px</option><option value="21">21 px</option></select></label>
    <button type="button" data-reset>Reset scene</button>
    <span class="fixture-label">Interactive sketch · invented prices/layout · no game saves</span>
  </header>
  <div class="viz-carousel" aria-label="LOTM scene representations">
    <section data-variant="Current panels" data-mode="panels" aria-label="Current panel style"><div class="game-shell"></div></section>
    <section data-variant="Hybrid scene" data-mode="hybrid" aria-label="Hybrid visual workspace" hidden><div class="game-shell"></div></section>
    <section data-variant="Walkable town" data-mode="walk" aria-label="Stardew-like walkable scene" hidden><div class="game-shell"></div></section>
  </div>
</div>
