<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOTM investigation comparison</title><link rel="stylesheet" href="style.css"></head><body style="margin:0;background:#080d28"><div id="lotm-case">
 <header class="study-tools" aria-label="Case comparison settings">
  <span class="study-label">LOTM / THE LAMPLIGHT CASE</span>
  <label>Start <select data-setting="scenario"><option value="investigate">Investigation</option><option value="combat">Prepared confrontation</option><option value="low">Low spirituality</option></select></label>
  <label>Text <select data-setting="text"><option value="14">14 px</option><option value="21">21 px</option></select></label>
  <button type="button" data-reset>Reset case</button>
  <span class="fixture-label">Original LOTM-inspired case · simulated mechanics · no canon event or game saves</span>
 </header>
 <div class="viz-carousel" aria-label="Investigation and combat representations">
  <section data-variant="Current panels" data-mode="panels" aria-label="Panel investigation"><div class="game-shell"></div></section>
  <section data-variant="Hybrid caseboard" data-mode="hybrid" aria-label="Hybrid investigation" hidden><div class="game-shell"></div></section>
  <section data-variant="Gaslight cutaway" data-mode="walk" aria-label="Walkable gaslight investigation" hidden><div class="game-shell"></div></section>
 </div>
</div>
<script src="scene.js"></script></body></html>
