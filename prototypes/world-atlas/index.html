.sheet details details{margin:.4rem 0 .4rem .9rem;padding-left:.8rem;border-left:2px solid #c2cdba}.sheet details p{margin:.3rem 1rem}.sheet details button,.sheet details a{display:block;margin:.3rem}.sheet summary:focus-visible{outline:2px solid #875317}

<header><h1>World atlas</h1><nav aria-label="Atlas sections"></nav></header><div class="atlas-trail" aria-label="Where you are"></div><main id="main">Loading world records…</main>
<script type="module">
import {boxCanvas, element as el} from '/canvas.mjs';
import {createCreatureRecord} from '/creature-record.js';
import {dangerLabel} from '/map-marks.js';
import {placeMarks, villageDiagram} from '/village-layout.mjs';
import {bookWorlds} from '/book-worlds.mjs';
import {otherPlaces} from '/other-places.mjs';
import {readingPipeline, libraryShelves, mechanicReadiness, libraryWorlds} from '/library-views.mjs';
import {creatureMarks, creatureOverview, creatureShelf, creatureNeighborhood, libraryEdges} from '/creature-layout.mjs';

const main=document.querySelector('main'), nav=document.querySelector('nav');
const button=(label,fn)=>{const b=el('button',label);b.type='button';b.onclick=fn;return b};
const list=rows=>{const ul=el('ul');for(const r of rows)ul.append(el('li',r));return ul};const listOf=list;
const detail=(title,value)=>{const d=el('details');d.append(el('summary',title),el('pre',value));return d};
const data=await (await fetch('/data')).json();data.bookIndex={};
let draft={...data.draft};
// One shell: four sections; a world owns its places, walks and reading. Old tab links still land.
const WORLDS=[
 {id:'village',label:'The Village',note:'Native region, where a fresh game starts',views:['places']},
 {id:'lotm',label:'Lord of the Mysteries',cast:'lotm',group:'Lord of the Mysteries',views:['places','locations','districts','reading']},
 {id:'mol',label:'Mother of Learning',cast:'mol',group:'Mother of Learning',views:['places','locations','encounter','reading']},
 {id:'hp',label:'Harry Potter',group:'Harry Potter',views:['locations','reading']},
 {id:'ri',label:'Reverend Insanity',group:'Reverend Insanity',views:['locations','reading']},
 {id:'ss',label:'Shadow Slave',group:'Shadow Slave',views:['locations','reading']},
 {id:'paradise',label:'Reincarnation Paradise',group:'Reincarnation Paradise',views:['locations']},
 {id:'proto23',label:'Proto23 reference',group:'Proto23 reference',views:['locations']},
 {id:'testpacks',label:'Private test packs',group:'Private test packs',views:['locations']},
 {id:'frontier',label:'Frontier outposts',note:'Registered, but no route from the Village at a fresh start',group:'Frontier, not reached from the Village',views:['locations']},
];
const worldById=new Map(WORLDS.map(w=>[w.id,w]));
const VIEW_LABELS={places:'Places',locations:'Registered locations',districts:'Walk districts',encounter:'Cyoria encounter',reading:'Reading',
 pipeline:'Reading pipeline',shelves:'Library shelves',mechanics:'Mechanic readiness',kinds:'Creatures and kinds',observations:'Identified target',site:'Village site workshop'};
const SECTIONS=[{id:'worlds',label:'Worlds'},{id:'library',label:'Library',views:['pipeline','shelves','mechanics']},
 {id:'creatures',label:'Creatures',views:['kinds','observations']},{id:'workbench',label:'Workbench',views:['site']}];
const LEGACY={'village-region':'world/village/places','other-game-places':'worlds','book-worlds':'world/lotm/places','reading-pipeline':'library/pipeline',
 'library-shelves':'library/shelves','mechanic-readiness':'library/mechanics','tingen-districts':'world/lotm/districts','world-library':'worlds',
 'entity-library':'creatures/kinds','village-site-workshop':'workbench/site','cyoria-encounter':'world/mol/encounter','identified-target':'creatures/observations'};
const go=hash=>{location.hash=hash};
function route(){
 const raw=location.hash.slice(1);if(LEGACY[raw]){history.replaceState(null,'','#'+LEGACY[raw]);return route()}
 const [section='worlds',a,b]=raw.split('/');
 if(section==='world'&&worldById.has(a)){const w=worldById.get(a);return {section:'worlds',world:w,view:w.views.includes(b)?b:w.views[0]}}
 const s=SECTIONS.find(x=>x.id===section)||SECTIONS[0];
 return {section:s.id,view:s.views?.includes(a)?a:s.views?.[0]};
}
const trail=document.querySelector('.atlas-trail');
function crumb(label,hash){const b=button(label,()=>go(hash));b.className='trail-link';return b}
function showPage(){
 const r=route();
 for(const b of nav.children)b.setAttribute('aria-pressed',String(b.dataset.section===r.section));
 trail.replaceChildren();
 const crumbs=el('nav',null,'trail-crumbs');crumbs.setAttribute('aria-label','Breadcrumb');
 const views=el('nav',null,'trail-views');views.setAttribute('aria-label','Views');
 const section=SECTIONS.find(s=>s.id===r.section);
 crumbs.append(crumb(section.label,r.section==='worlds'?'worlds':r.section));
 let list=[];
 if(r.world){crumbs.append(el('span','›','trail-sep'),crumb(r.world.label,'world/'+r.world.id));list=r.world.views.map(v=>[v,'world/'+r.world.id+'/'+v])}
 else if(section.views)list=section.views.map(v=>[v,r.section+'/'+v]);
 for(const [v,hash] of list){const b=button(VIEW_LABELS[v],()=>go(hash));b.setAttribute('aria-pressed',String(v===r.view));views.append(b)}
 trail.append(crumbs);if(list.length>1)trail.append(views);
 main.replaceChildren();
 const shared={main,data,controls,finder,list:listOf,button,routeButtons,closeCanvas};
 if(r.world)return worldView(r.world,r.view,shared);
 if(r.section==='worlds')return worldsIndex();
 ({pipeline:()=>readingPipeline(shared),shelves:()=>libraryShelves(shared),mechanics:()=>mechanicReadiness(shared),
   kinds:()=>library(),observations:target,site:editor})[r.view]();
}
function worldView(w,view,shared){
 if(view==='places'&&w.id==='village')return regionalMap();
 if(view==='places')return bookWorlds({...shared,worldId:w.cast,fixed:true});
 if(view==='locations')return otherPlaces({...shared,group:w.group,title:w.label+' · registered locations'});
 if(view==='districts')return map();
 if(view==='encounter')return encounter();
 if(view==='reading')return readingPipeline({...shared,worldId:w.id,fixed:true});
}
for(const s of SECTIONS){const b=button(s.label,()=>go(s.id));b.dataset.section=s.id;nav.append(b)}
window.addEventListener('hashchange',showPage);
const recById=new Map(data.library.map(r=>[r.id,r]));
function tree(parent,label,value,opened=false){
 if(value==null||value===''||(typeof value==='object'&&!Object.keys(value).length))return;
 if(typeof value!=='object'||Array.isArray(value)){
  const row=el('p');row.className='tree-fact';row.append(el('b',label+' '),document.createTextNode(Array.isArray(value)?value.map(v=>String(v).replaceAll('_',' ').replace(/([a-z])([A-Z])/g,'$1 $2')).join(' · '):value));parent.append(row);return;
 }
 const branch=el('details');branch.className='tree-branch';branch.open=opened;branch.append(el('summary',label));
 for(const [k,v] of Object.entries(value))tree(branch,k,v);parent.append(branch);
}
function controls(){const bar=el('nav');bar.className='atlas-tools';main.append(bar);return bar}
function finder(bar,records,open){
 const search=el('input'),choices=el('div');search.type='search';search.placeholder='Find a record';search.setAttribute('aria-label',search.placeholder);
 bar.append(search,choices);search.oninput=()=>{choices.replaceChildren();const q=search.value.trim().toLowerCase();if(!q)return;
  const matches=records.filter(r=>(r.label+' '+r.id).toLowerCase().includes(q));for(const r of matches.slice(0,16))choices.append(button(r.label,()=>open(r)));
  if(!matches.length)choices.textContent='No matching records.';else if(matches.length>16)choices.append(el('small','Refine your search for more matches.'))};
}
function routeButtons(links, go) {
 const rows = el('div', null, 'canvas-links');
 for (const {label, detail, id} of links) {
  const row = button('', () => go(id));
  row.append(el('span', label));
  if (detail) row.append(el('small', detail));
  rows.append(row);
 }
 return rows;
}
// Closing a canvas goes up one level: a world view to its world's first view, anything else to Worlds.
const closeCanvas = () => {const r=route();go(r.world&&r.view!==r.world.views[0]?'world/'+r.world.id:'worlds')};
function regionalMap(id, local = false) {
 main.replaceChildren();
 const byId = new Map(data.frontier.map(place => [place.id, place]));
 const near = new Set(local ? [id] : byId.keys());
 if (local) {
  for (let step = 0; step < 2; step++) {
   for (const placeId of [...near]) for (const route of byId.get(placeId).routes) near.add(route.id);
  }
 }
 const places = data.frontier.filter(place => near.has(place.id));
 const start = places.find(place => place.current);
 const bar = controls();
 finder(bar, data.frontier, place => near.has(place.id) ? board.select(place.id, true) : regionalMap(place.id, true));
 bar.append(el('small', places.length + ' registered places'));
 const board = boxCanvas({
  parent: main, title: local ? 'Local routes' : 'Village region', ...villageDiagram(places), marks: placeMarks, kind: 'village',
  initial: id || start?.id, close: closeCanvas,
  select(placeId, side, select) {
   const place = byId.get(placeId);
   const kind = place.danger ? dangerLabel(place.danger) : place.housing ? 'Dwelling' : 'Location';
   side.append(el('small', place.current ? 'You are here · Fresh game start' : kind), el('h2', place.label),
    button(local ? 'Whole region' : 'Inspect local area', () => regionalMap(placeId, !local)));
   const facts = el('div', null, 'canvas-facts');
   for (const [label, values] of [['Residents', place.people], ['Crafts', place.craft], ['Activities', place.activities]]) {
    if (!values.length) continue;
    const group = el('details');
    group.open = label === 'Residents';
    group.append(el('summary', label + ' · ' + values.length), list(values.map(v => v.replaceAll('_', ' ').replace(/([a-z])([A-Z])/g, '$1 $2').replace(/^./, first => first.toUpperCase()))));
    facts.append(group);
   }
   if (facts.childElementCount) side.append(facts);
   if (place.routes.length) {
    side.append(el('h3', 'Connected places'), routeButtons(place.routes.map(route => ({
     id: route.id, label: byId.get(route.id).label,
     detail: route.minutes == null ? 'Return' : route.minutes < 60 ? route.minutes + ' min'
      : Math.floor(route.minutes / 60) + 'h' + (route.minutes % 60 ? ' ' + route.minutes % 60 + 'm' : '')
    })), dest => near.has(dest) ? select(dest, true) : regionalMap(dest, true)));
   }
   side.append(el('small', 'Routes may require progress in your life.'));
  }
 });
}
const worldMarks=[{key:'walk',icon:'directions_walk',label:'Has places you can walk'},{key:'partial',icon:'hourglass_bottom',label:'Reading in progress'},
 {key:'read',icon:'menu_book',label:'Read through'},{key:'selected',label:'Selected'}];
function worldStats(w){
 const reading=libraryWorlds(data).find(r=>r.id===w.id),cast=w.cast&&data.books?.[w.cast];
 const located=w.group?data.others.filter(r=>r.group===w.group).length:0;
 const places=w.id==='village'?data.frontier.length:(cast?cast.places.length:0);
 const walk=w.id==='village'?data.frontier.length:cast?(cast.places.some(p=>p.district)?cast.places.filter(p=>p.district).length:cast.places.length):0;
 return {reading,places,located,walk};
}
function worldsIndex(){
 const stats=new Map(WORLDS.map(w=>[w.id,worldStats(w)]));
 const readingOnly=libraryWorlds(data).filter(r=>!worldById.has(r.id));
 const bar=controls();
 bar.append(el('small',`${WORLDS.length} worlds in the game · ${readingOnly.length} more read but not used by the game yet`));
 finder(bar,WORLDS,w=>go('world/'+w.id));
 const order=[['village','lotm','mol'],['hp','ri','ss','paradise'],['proto23','testpacks','frontier','library']];
 const nodes=[];
 order.forEach((row,r)=>row.forEach((id,c)=>{
  const x=(c-(row.length-1)/2)*250,y=r*110;
  if(id==='library')return nodes.push({id,label:`Read, not in the game · ${readingOnly.length}`,x,y,w:220,h:58,group:'library',marks:[]});
  const w=worldById.get(id),st=stats.get(id),count=st.places||st.located;
  nodes.push({id,label:`${w.label} · ${count}`,x,y,w:220,h:58,group:st.walk?'walk':'registered',
   marks:[...(st.walk?[worldMarks[0]]:[]),...(st.reading?.readState==='partial'?[worldMarks[1]]:[]),...(st.reading?.readState==='complete'?[worldMarks[2]]:[])]});
 }));
 boxCanvas({parent:main,title:'Worlds',nodes,edges:[],marks:worldMarks,kind:'worlds',initial:'village',
  select(id,side){
   if(id==='library'){side.append(el('small','Library'),el('h2','Read, not in the game'),el('p',readingOnly.length+' reading worlds have no game consumer yet.'),
    listOf(readingOnly.slice(0,8).map(r=>r.label+' · '+{complete:'read through',partial:'partly read',none:'prepared'}[r.readState])),button('Open reading pipeline',()=>go('library/pipeline')));return}
   const w=worldById.get(id),st=stats.get(id);
   side.append(el('small',st.walk?'In the game · walkable':'In the game · registered locations'),el('h2',w.label));
   if(w.note)side.append(el('p',w.note));
   side.append(listOf([
    st.places?`${st.places} places${w.cast?' from the cast pack':''}`:null,
    st.located&&w.id!=='village'?`${st.located} registered locations`:null,
    st.walk&&w.cast?`${st.walk} on a walk`:null,
    st.reading?`Reading: ${st.reading.keys.length} keys, ${Math.round(st.reading.coverage*100)}% of passes done`:'No reading keys',
   ].filter(Boolean)));
   side.append(routeButtons(w.views.map(v=>({id:v,label:VIEW_LABELS[v]})),v=>go('world/'+id+'/'+v)));
  }});
}
const libraryGroup = rec => rec.group === 'Living kinds' ? rec.world : rec.group;
const groupNames = new Map([
 ['animal', 'Animals'], ['person', 'People (kind)'], ['plant', 'Plants'], ['construct', 'Constructs'], ['gu', 'Gu']
]);
const creatures = creatureOverview(data.library);
const libraryGroups = Map.groupBy(data.library, libraryGroup);

function inspectRecord(rec, side) {
 if (rec.id === 'household.moss') {
  const record = createCreatureRecord(document, {expanded:true});
  record.update(data.target[0]);
  side.append(record.node, button('Compare observations', () => go('creatures/observations')));
  return;
 }
 const family = el('div', null, 'canvas-record');
 const root = el('details');
 root.open = true;
 const name = el('span', rec.label, 'canvas-record-name');
 name.title = rec.label;
 const summary = el('summary');
 summary.append(name);
 root.append(summary);
 const fields = {...rec.fields};
 for (const [label, value] of Object.entries(fields)) tree(root, label, value, label === 'Body');
 if (root.children.length === 1) root.append(el('p', 'No further details recorded.', 'tree-fact'));
 family.append(root);
 side.append(el('small', groupNames.get(libraryGroup(rec)) || rec.group), family);
}

function library(id, scope = id ? 'neighbors' : 'connections') {
 main.replaceChildren();
 const bar = controls();
 finder(bar, data.library, rec => board.has(rec.id) ? board.select(rec.id, true) : library(rec.id));
 const groups = el('nav', null, 'canvas-index');
 groups.setAttribute('aria-label', 'Library views');
 for (const group of ['connections', ...libraryGroups.keys()]) {
  const label = group === 'connections' ? 'Connections' : groupNames.get(group) || group;
  const tab = button(label, () => library(undefined, group));
  tab.setAttribute('aria-pressed', String(scope === group));
  groups.append(tab);
 }
 main.append(groups);

 let diagram, title;
 if (scope === 'connections') {
  diagram = creatures;
  title = 'Creature connections';
 } else if (scope === 'neighbors') {
  const rec = recById.get(id);
  const records = [...new Set([rec.id, ...rec.links.map(link => link.id)])].map(key => recById.get(key));
  diagram = {nodes: creatureNeighborhood(rec, records), edges: libraryEdges(records)};
  title = 'Connections around ' + rec.label;
 } else {
  const records = libraryGroups.get(scope);
  diagram = {nodes: creatureShelf(records), edges: libraryEdges(records)};
  title = groupNames.get(scope) || scope;
 }

 const board = boxCanvas({
  parent: main, title, ...diagram, marks: creatureMarks, initial: id || (scope === 'connections' ? 'household.moss' : undefined), close: closeCanvas,
  select(key, side, select) {
   const rec = recById.get(key);
   inspectRecord(rec, side);
   if (rec.links.length) {
    side.append(el('h3', 'Relationships'), routeButtons(rec.links.map(link => ({
     id: link.id, label: recById.get(link.id).label, detail: link.relation
    })), dest => board.has(dest) ? select(dest, true) : library(dest)));
    if (scope !== 'neighbors') side.append(button('Show direct links', () => library(rec.id)));
   }
  }
 });
}
function graph(nodes,edges,onSelect,height){
 const layout=el('div'),viewport=el('div'),plane=el('div'),inspector=el('aside');
 layout.className='atlas-workspace';viewport.className='atlas-viewport';plane.className='atlas-plane';if(height)plane.style.height=height+'px'
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.setAttribute('aria-hidden','true');plane.append(svg);viewport.append(plane);layout.append(viewport,inspector);main.append(layout);
 const zoom=el('div');zoom.className='map-scale';let scale=1;
 function resize(factor){scale=Math.max(1,Math.min(3,factor));plane.style.width=(scale*100)+'%';plane.style.height=(baseHeight*scale)+'px';out.textContent=Math.round(scale*100)+'%'}
 const out=el('output','100%'),baseHeight=plane.offsetHeight;
 zoom.append(button('−',()=>resize(scale-.25)),out,button('+',()=>resize(scale+.25)));
 zoom.firstChild.setAttribute('aria-label','Zoom out');zoom.lastChild.setAttribute('aria-label','Zoom in');layout.before(zoom);
 let pan;viewport.onpointerdown=e=>{if(e.button!==0||e.target.closest('button'))return;pan={x:e.clientX,y:e.clientY,left:viewport.scrollLeft,top:viewport.scrollTop};viewport.setPointerCapture(e.pointerId)};
 viewport.onpointermove=e=>{if(pan)viewport.scrollTo(pan.left+pan.x-e.clientX,pan.top+pan.y-e.clientY)};viewport.onlostpointercapture=()=>{pan=null};
 const lines=edges.map(([from,to])=>{const line=document.createElementNS(svg.namespaceURI,'line');svg.append(line);return {line,from,to}});
 let active=0;
 function position(){nodes.forEach((n,i)=>{buttons[i].style.left=n.x+'%';buttons[i].style.top=n.y+'%'});
  for(const {line,from,to} of lines){const a=nodes[from],b=nodes[to];for(const [i,n] of [a,b].entries()){
    line.setAttribute('x'+(i+1),n.x+'%');line.setAttribute('y'+(i+1),n.y+'%')}
    line.classList.toggle('traced',from===active||to===active)}}
 function select(i){active=i;buttons.forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));position();inspector.replaceChildren();onSelect(i,inspector,select)}
 const buttons=nodes.map((n,i)=>{const b=button('',()=>select(i));b.className='atlas-stop';b.append(el('small',n.kind),el('strong',n.label));plane.append(b);
  let drag;
  b.onpointerdown=e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,left:n.x,top:n.y};b.setPointerCapture(e.pointerId)};
  b.onpointermove=e=>{if(!drag)return;n.x=Math.max(12,Math.min(88,drag.left+(e.clientX-drag.x)*100/plane.clientWidth));n.y=Math.max(7,Math.min(94,drag.top+(e.clientY-drag.y)*100/plane.clientHeight));position()};
  b.onlostpointercapture=()=>{drag=null};return b});
 select(0);
 return {select,rename:(i,text)=>buttons[i].lastChild.textContent=text,focus:i=>buttons[i].focus({preventScroll:true}),reveal:i=>{const b=buttons[i];viewport.scrollTo({left:b.offsetLeft-viewport.clientWidth/2,top:b.offsetTop-viewport.clientHeight/2})}};
}
function map(){
 const places=data.places,short=n=>n.replace(/^Tingen /,'');
 const at=[[-240,0],[0,-140],[240,0],[0,140]];
 const nodes=places.map((p,i)=>({id:p.name,label:short(p.name),x:at[i]?.[0]??i*200,y:at[i]?.[1]??260,w:190,h:50,marks:[]}));
 const edges=[];places.forEach((p,i)=>p.routes.forEach(r=>{const j=places.findIndex(v=>v.name===r.dest);if(j>i)edges.push({from:p.name,to:r.dest,both:true})}));
 const bar=controls();bar.append(el('small',places.length+' supervised districts with walks and local actions'));
 // Search reaches officers and commands too, as before.
 finder(bar,[...places.map(p=>({id:p.name,label:short(p.name)})),...places.flatMap(p=>p.actions.map(a=>({id:p.name+'|'+a.id+' '+(data.actors[a.target]||''),label:a.label+' · '+short(p.name),place:p.name})))],r=>board.select(r.place||r.id,true));
 const board=boxCanvas({parent:main,title:'Tingen walk districts',nodes,edges,kind:'village',close:closeCanvas,
  marks:[{key:'route',label:'Walk'},{key:'selected',label:'Selected'}],
  select(id,side,select){const p=places.find(x=>x.name===id);side.append(el('small',p.district),el('h2',p.name),el('p',p.team+' jurisdiction'),el('h3','Walks'),
   routeButtons(p.routes.map(r=>({id:r.dest,label:short(r.dest),detail:r.minutes+' min'})),dest=>select(dest,true)));
   if(p.actions.length)side.append(el('h3','Local actions'));
   for(const a of p.actions){const row=el('section');row.append(el('strong',a.label));if(a.target)row.append(el('small',data.actors[a.target]||a.target));row.append(detail('Command definition',[a.id,JSON.stringify(a.requires,null,2)].join('\n')));side.append(row)}
  }});
}
function encounter(){for(const e of data.encounters){const a=el('article');a.className='sheet';a.append(el('small',e.place),el('h2',e.name),el('p','Target · '+e.target),el('h3','Opponent actions assigned here'),list(e.actions),detail('Opening conditions',JSON.stringify(e.requires,null,2)));e.turns.forEach((turn,i)=>a.append(el('h3','Exchange '+(i+1)),list(turn)));main.append(a)}}
function target(){
 const article=el('article', null, 'creature-object');
 const tabs=el('nav'), record=createCreatureRecord(document,{expanded:true});
 tabs.setAttribute('aria-label','Observed conditions');
 const draw=i=>{
  record.update(data.target[i]);
  [...tabs.children].forEach((button,j)=>button.setAttribute('aria-pressed',String(i===j)));
 };
 for(const [i,label] of ['First meeting','After playing with yarn','Smoke in the room'].entries()) tabs.append(button(label,()=>draw(i)));
 const link=el('a','Open creature fieldbook');link.href='/creatures';
 article.append(tabs,record.node,link);main.append(article);draw(0);
}
function editor(){
 const groups=[
  {kind:'Location',key:'siteName',fields:['siteName','siteDescription'],x:18,y:49},
  {kind:'Gather',key:'inputName',fields:['inputName','inputStart','gatherMinutes','gatherAmount'],x:49,y:21},
  {kind:'Work',key:'activityName',fields:['activityName','activityDescription','requiredInput','inputCost','minutes'],x:49,y:76},
  {kind:'Product',key:'outputName',fields:['outputName','outputGain','coinPay'],x:81,y:49}
 ];
 const exportButton=button('Export playable site',async()=>{try{
  const r=await fetch('/export',{method:'POST',body:JSON.stringify(draft)});if(!r.ok)throw Error(await r.text());
  const url=URL.createObjectURL(await r.blob()),a=el('a');a.href=url;a.download='authored-site.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='Exported. In Your own places, import the file and choose Apply site.';
 }catch(e){status.textContent=e.message}});
 const bar=el('div'),status=el('output');bar.append(exportButton,status);main.append(el('h2','Village site workshop'),el('p','Select a node to edit it. Drag to arrange the diagram. Import the exported site through Your own places.'),bar);
 const board=graph(groups.map(g=>({...g,label:draft[g.key]})),[[0,1],[0,2],[1,2],[2,3]],(i,side)=>{
  const g=groups[i];side.append(el('small',g.kind),el('h2',draft[g.key]));
  for(const key of g.fields){const [,type,title,min,max]=data.fields.find(f=>f[0]===key);
   const label=el('label',title),input=el(type==='text'&&max>60?'textarea':'input');input.name=key;input.value=draft[key];
   if(type==='int'){input.type='number';input.min=min;input.max=max}else input.maxLength=max;
   input.oninput=()=>{draft[key]=type==='int'?input.valueAsNumber:input.value;status.textContent='';if(key===g.key){board.rename(i,input.value);side.querySelector('h2').textContent=input.value}};
   label.append(input);side.append(label)}
 });
}
showPage();
</script></html>
