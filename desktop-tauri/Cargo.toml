[package]
name = "yairpg-tauri"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tauri-plugin-window-state = "=2.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString", "NSObject", "NSError", "NSSet"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "block2", "bitflags"] }
block2 = "0.6"

[profile.release]
strip = true
